name: Package and release

# Fires on every pushed tag (e.g. `git tag v1.2.3 && git push origin v1.2.3`). Uses
# BigWigsMods/packager, the standard tool most WoW addons use for this: it reads .pkgmeta, zips
# the addon, substitutes @project-version@ in the .toc with the tag name, and uploads the result
# to CurseForge (and, if the matching secrets/tokens below are added, WoWInterface/Wago too) --
# no manual zip upload needed.
on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          # Optional -- only used if these secrets are also added later:
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
